name: Build OrangeFox Recovery - Redmi Note 15 4G (spinel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get clean

    - name: Set up Swap Space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf build-essential libssl-dev libxml2-utils xsltproc \
          fontconfig pngcrush imagemagick zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-dev readline-common libncurses5 git flex bison \
          python3 python-is-python3 repo ccache rsync

    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize OrangeFox 16.0
      run: |
        mkdir -p ~/fox
        cd ~/fox
        repo init \
          -u https://gitlab.com/OrangeFox/Manifest.git \
          -b fox_16.0 \
          --depth=1

    - name: Sync OrangeFox 16.0
      run: |
        cd ~/fox
        repo sync \
          --force-sync \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          -j2

    - name: Copy Device Tree
      run: |
        mkdir -p ~/fox/device/xiaomi/spinel
        rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' \
          "$GITHUB_WORKSPACE/" ~/fox/device/xiaomi/spinel/

    - name: Build Recovery
      run: |
        (
          while true; do
            echo
            echo "===== RESOURCE CHECK $(date) ====="
            free -h
            echo "--- SWAP ---"
            swapon --show
            echo "--- LOAD ---"
            uptime
            echo "--- DISK ---"
            df -h / /home/runner
            echo "--- TOP MEMORY ---"
            ps -eo pid,ppid,%mem,%cpu,rss,stat,comm --sort=-rss | head -15
            echo "=== SOONG ENV ==="
            env | grep -E 'SOONG|NINJA|ANDROID|JOBS|RBE' | sort

            echo "=== SOONG PROCESS ==="
            pgrep -a soong_build || true

            echo "=== PROCESS LIMITS ==="
            cat /proc/$(pgrep -o soong_build)/status 2>/dev/null || true
            sleep 10
          done
        ) &
        MONITOR_PID=$!

        trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT

        cd ~/fox

        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export FOX_BUILD_DEVICE="spinel"
        export LC_ALL="C"
        export TARGET_SCREEN_WIDTH=1080
        export TARGET_SCREEN_HEIGHT=2400
        export SOONG_UI_NINJA_ARGS="-j1"
        export NINJA_ARGS="-j1"

        source build/envsetup.sh
        lunch fox_spinel-bp2a-eng

        echo "===== BEFORE MKA ====="
        nproc
        free -h
        swapon --show
        df -h

        mka vendorbootimage -j1

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-spinel-Build
        path: |
          /home/runner/fox/out/target/product/spinel/OrangeFox*.img
          /home/runner/fox/out/target/product/spinel/OrangeFox*.zip
          /home/runner/fox/out/target/product/spinel/vendor_boot.img
